CONFIG_GPIO=y
CONFIG_SPI=y
CONFIG_DAC=y
CONFIG_DAC_DACX0508=y
CONFIG_ADC=y
CONFIG_ADC_LOG_LEVEL_INF=y
CONFIG_LOG=y
CONFIG_DAC_LOG_LEVEL_DBG=y
CONFIG_LOG_BACKEND_UART=y
CONFIG_CBPRINTF_FP_SUPPORT=y

# Shell Support
CONFIG_SERIAL=y
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_SHELL=y
CONFIG_SHELL_BACKEND_SERIAL=y

# Persistent storage for FRA loopback calibration data (Settings on NVS,
# backed by the storage_partition reserved in the devicetree overlay).
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_FLASH_PAGE_LAYOUT=y
CONFIG_NVS=y
CONFIG_SETTINGS=y
CONFIG_SETTINGS_NVS=y